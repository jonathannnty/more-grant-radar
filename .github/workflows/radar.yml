# Autonomous radar (v4): scan, promote, verify, publish. No human step.
# See specs/2026-10-20-autonomous-radar-design.md. v3 queued finds in GitHub
# Issues for a human; nobody triaged them for two months. Now every find lands on
# the site the same day, and the weekly AI pass verifies it into grants.json.
name: radar

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 4am PT
  push:                    # code changes run the radar once (bot commits don't retrigger)
    branches: [main]
    paths: ["scripts/**", "site/**", "agent/**", ".github/workflows/radar.yml"]
  workflow_dispatch:
    inputs:
      ai_pass:
        description: "Run the AI verification pass now (normally Mondays)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pypdf anthropic

      - name: Configure git bot identity
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"

      # 1. Refresh: republish first so countdowns stay right even if a scan fails.
      - name: Refresh site
        run: python scripts/generate.py --today "$(date -u +%F)"

      - name: Commit refreshed site
        run: |
          git add docs data/radar.csv data/archive.csv ics apps_script/setup.gs
          git diff --cached --quiet || git commit -m "radar: refresh site $(date -u +%F)"
          git push

      # 2. Scan. Each scanner writes finds/*.json and a run stamp. A crashing
      # scanner is recorded as an error stamp (shown on the site), never fatal.
      - name: Scan federal, state, county and settlement sources
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          mkdir -p finds
          python scripts/scan_grants_gov.py --json finds/grants_gov.json > /dev/null \
            || python scripts/runlog.py scan_grants_gov error --note "scanner crashed"
          if [ -n "$SAM_API_KEY" ]; then
            python scripts/scan_sam.py --json finds/sam.json > /dev/null \
              || python scripts/runlog.py scan_sam error --note "scanner crashed"
          else
            python scripts/runlog.py scan_sam skipped --note "no SAM_API_KEY secret"
          fi
          python scripts/scan_states.py --out finds \
            || python scripts/runlog.py scan_states error --note "scanner crashed"
          python scripts/nofo_watch.py --update --json finds/nofo.json > /dev/null \
            || python scripts/runlog.py nofo_watch error --note "scanner crashed"
          if [ "$(date -u +%d)" = "01" ]; then
            if python scripts/winners_feed.py --json finds/winners.json > /dev/null; then
              python scripts/runlog.py winners ok
            else
              python scripts/runlog.py winners error --note "winners feed crashed"
            fi
          fi

      - name: Promote finds to leads
        run: python scripts/promote_leads.py --finds finds --today "$(date -u +%F)"

      # 3. Verify: Mondays, or on demand. Needs the ANTHROPIC_API_KEY secret.
      # Without it, ai_pass.py records "skipped" and the site's banner says so.
      - name: AI verification pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PASS_MAX_USD: ${{ vars.AI_PASS_MAX_USD || '12' }}
          FORCE: ${{ github.event.inputs.ai_pass }}
        run: |
          # On demand without the CLI: push a file named agent/RUN_AI_PASS_NOW.
          if [ "$(date -u +%u)" = "1" ] || [ "$FORCE" = "true" ] || [ -f agent/RUN_AI_PASS_NOW ]; then
            python scripts/ai_pass.py --today "$(date -u +%F)" \
              || python scripts/runlog.py ai_pass error --note "ai_pass crashed"
            git rm -q --ignore-unmatch agent/RUN_AI_PASS_NOW
          else
            echo "Not Monday: AI pass runs weekly."
          fi

      # 4. Publish everything the run learned.
      - name: Rebuild site with new leads and run stamps
        run: python scripts/generate.py --today "$(date -u +%F)"

      - name: Commit data and site
        run: |
          git add docs data ics apps_script/setup.gs
          git reset -q data/winners.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "radar: scan + leads $(date -u +%F)"
          git pull --rebase -q || true
          git push

      # Idempotent cleanup: the v3 review Issues are obsolete. Close any still open.
      - name: Close obsolete v3 review issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label radar-review --state open --limit 200 --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Superseded by the autonomous radar (v4). New finds now appear on the site the same day under \"Found by the radar\" and are verified weekly. Nothing to triage here." || true
          done
